project:
  name: "WSN Simulator"
  version: "0.1.0"

network:
  width_m: 2000
  height_m: 2000
  num_sensors: 500
  random_seed: 42

sink:
  x: 1000
  y: 1000

energy:
  e_elec_nj_per_bit: 50
  eps_fs_pj_per_bit_m2: 10
  eps_mp_pj_per_bit_m4: 0.0013
  per_hop_delay_ms: 10

radio:
  data_rate_bps: 250000

  processing_delay_ms_per_hop: 1.0

  propagation_speed_m_s: 300000000


sensor:
  initial_energy_j: 20.0
  transmission_range_m: 250
  energy_threshold_ratio: 0.15

packet:
  payload_size_bytes: 64
  sampling_interval_seconds: 10

simulation:
  mode: "round_based"
  max_rounds: 10000

  time:
    start_datetime: "2026-01-01 00:00:00"

    # 1 round = 1 giờ mô phỏng
    round_duration_minutes: 60

routing:
  algorithm: "lb_ecmhr"

  energy_threshold_ratio: 0.15

  lb_ecmhr:
    # Tải relay được tính trên bao nhiêu round gần nhất
    load_window_rounds: 10

    # Relay có tải >= 1.5 lần mức trung bình
    # được xem là overloaded
    overload_factor: 1.5

    # Relay overloaded chỉ được phục hồi khi
    # tải giảm xuống <= 1.1 lần trung bình
    recovery_factor: 1.1

    # Cho phép đi vòng tối đa 1 hop
    # để tránh hotspot
    max_extra_hops: 1

    # Nếu không có đường tránh overload hợp lệ,
    # vẫn dùng relay overloaded để duy trì connectivity
    allow_overload_fallback: true

    # Performance
    route_update_interval_rounds: 6
    candidate_routes_per_source: 6

sensor_types:
  temperature: 100
  humidity: 100
  pm25: 100
  wind: 100
  water_quality: 100

environment:
  enabled: true

  # RNG riêng cho dữ liệu môi trường.
  # Không ảnh hưởng vị trí sensor.
  seed_offset: 10000

  # 1 round = 1 giờ
  temporal_period_rounds: 24

  # Tương quan theo thời gian.
  # Giá trị hiện tại phụ thuộc khoảng 72% trạng thái trước.
  temporal_correlation: 0.72

  # Điều chỉnh mức phân hóa toàn bản đồ.
  spatial_strength: 1.0

  # Điều chỉnh mức độ ô nhiễm.
  pollution_strength: 1.0

  # Dữ liệu cũ hơn 6 giờ được xem là giảm độ tươi mới
  freshness_max_rounds: 6

  noise:
    temperature: 0.30
    humidity: 0.80
    pm25: 2.5
    wind: 0.25
    water_quality: 1.0

  bounds:
    temperature: [18, 45]
    humidity: [20, 100]
    pm25: [0, 200]
    wind: [0, 15]
    water_quality: [0, 100]

  zones:
    zone_size_m: 200

  interpolation:
    method: "idw"
    power: 2
    grid_resolution: 70

  confidence:
    support_radius_m: 450
    low_confidence_threshold: 0.45

  living_quality:

    minimum_indicators_for_elqi: 3

    weights:
      temperature: 0.20
      humidity: 0.15
      pm25: 0.30
      wind: 0.10
      water_quality: 0.25

    scoring:

      temperature:
        method: "optimal_range"
        hard_min: 15.0
        ideal_min: 22.0
        ideal_max: 30.0
        hard_max: 42.0

      humidity:
        method: "optimal_range"
        hard_min: 20.0
        ideal_min: 40.0
        ideal_max: 70.0
        hard_max: 95.0

      pm25:
        method: "breakpoints"
        breakpoints:
          - [0, 100]
          - [15, 90]
          - [35, 70]
          - [55, 50]
          - [100, 20]
          - [200, 0]

      wind:
        method: "optimal_range"
        hard_min: 0.0
        ideal_min: 0.5
        ideal_max: 5.0
        hard_max: 12.0

      water_quality:
        method: "direct_score"

    ratings:
      very_good:
        min_score: 80
        label: "Rất tốt"

      good:
        min_score: 65
        label: "Tốt"

      moderate:
        min_score: 50
        label: "Trung bình"

      poor:
        min_score: 35
        label: "Kém"

      very_poor:
        min_score: 0
        label: "Rất kém"

  # Phân tích môi trường không gian định kỳ (24 round = 1 ngày)
  analysis_interval_rounds: 24

  degradation:
    # So sánh khoảng một tuần trước (168 giờ = 7 ngày)
    lookback_rounds: 168

    improvement_threshold: 3.0
    stable_tolerance: 3.0

    significant_decline_threshold: -8.0
    severe_decline_threshold: -15.0

    minimum_confidence: 0.45

  alerts:
    warning_elqi_below: 50
    critical_elqi_below: 35
    significant_decline_below: -8

checkpoint:
  auto_save: false
  interval_rounds: 500
  directory: "checkpoints"
  keep_last: 3