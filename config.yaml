project:
  name: "WSN Simulator"
  version: "0.1.0"

network:
  width_m: 2000
  height_m: 2000
  num_sensors: 500
  random_seed: 42

sink:
  x: 1000
  y: 1000

energy:
  e_elec_nj_per_bit: 50
  eps_fs_pj_per_bit_m2: 10
  eps_mp_pj_per_bit_m4: 0.0013
  per_hop_delay_ms: 10

sensor:
  initial_energy_j: 2.0
  transmission_range_m: 200
  energy_threshold_ratio: 0.20

packet:
  payload_size_bytes: 128
  sampling_interval_seconds: 10

simulation:
  mode: "round_based"
  max_rounds: 1000

routing:
  algorithm: "minimum_hop"

  allow_emergency_mode: false
  emergency_threshold_ratio: 0.10

sensor_types:
  temperature: 100
  humidity: 100
  pm25: 100
  wind: 100
  water_quality: 100

environment:
  enabled: true

  temporal_period_rounds: 144
  temporal_smoothing: 0.85

  freshness_max_rounds: 5

  noise:
    temperature: 0.15
    humidity: 0.40
    pm25: 1.20
    wind: 0.12
    water_quality: 0.40

  bounds:
    temperature:
      min: 18.0
      max: 45.0

    humidity:
      min: 20.0
      max: 100.0

    pm25:
      min: 0.0
      max: 200.0

    wind:
      min: 0.0
      max: 15.0

    water_quality:
      min: 0.0
      max: 100.0

  zones:
    zone_size_m: 200

  interpolation:
    method: "idw"
    power: 2
    grid_resolution: 70

  confidence:
    support_radius_m: 450
    low_confidence_threshold: 0.45

  living_quality:

    minimum_indicators_for_elqi: 3

    weights:
      temperature: 0.20
      humidity: 0.15
      pm25: 0.30
      wind: 0.10
      water_quality: 0.25

    scoring:

      temperature:
        method: "optimal_range"
        hard_min: 15.0
        ideal_min: 22.0
        ideal_max: 30.0
        hard_max: 42.0

      humidity:
        method: "optimal_range"
        hard_min: 20.0
        ideal_min: 40.0
        ideal_max: 70.0
        hard_max: 95.0

      pm25:
        method: "breakpoints"
        breakpoints:
          - [0, 100]
          - [15, 90]
          - [35, 70]
          - [55, 50]
          - [100, 20]
          - [200, 0]

      wind:
        method: "optimal_range"
        hard_min: 0.0
        ideal_min: 0.5
        ideal_max: 5.0
        hard_max: 12.0

      water_quality:
        method: "direct_score"

    ratings:
      very_good:
        min_score: 80
        label: "Rất tốt"

      good:
        min_score: 65
        label: "Tốt"

      moderate:
        min_score: 50
        label: "Trung bình"

      poor:
        min_score: 35
        label: "Kém"

      very_poor:
        min_score: 0
        label: "Rất kém"