project:
  name: "WSN Simulator"
  version: "0.1.0"

network:
  width_m: 2000
  height_m: 2000
  num_sensors: 500
  random_seed: 42

sink:
  x: 1000
  y: 1000

energy:
  e_elec_nj_per_bit: 50
  eps_fs_pj_per_bit_m2: 10
  eps_mp_pj_per_bit_m4: 0.0013
  per_hop_delay_ms: 10

sensor:
  initial_energy_j: 2.0
  transmission_range_m: 200
  energy_threshold_ratio: 0.20

packet:
  payload_size_bytes: 128
  sampling_interval_seconds: 10

simulation:
  mode: "round_based"
  max_rounds: 1000

routing:
  algorithm: "minimum_hop"

  allow_emergency_mode: false
  emergency_threshold_ratio: 0.10

sensor_types:
  temperature: 100
  humidity: 100
  pm25: 100
  wind: 100
  water_quality: 100

environment:
  enabled: true

  temporal_period_rounds: 144
  temporal_smoothing: 0.85

  noise:
    temperature: 0.15
    humidity: 0.40
    pm25: 1.20
    wind: 0.12
    water_quality: 0.40

  bounds:
    temperature:
      min: 18.0
      max: 45.0

    humidity:
      min: 20.0
      max: 100.0

    pm25:
      min: 0.0
      max: 200.0

    wind:
      min: 0.0
      max: 15.0

    water_quality:
      min: 0.0
      max: 100.0

  zones:
    zone_size_m: 200

  interpolation:
    method: "idw"
    power: 2